<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ju Ribeiro — Designer de Produto &amp; Comunicação</title>
<meta name="description" content="Portfólio de Ju Ribeiro, Designer de Produto &amp; Comunicação há +6 anos: experiências digitais, comunicação criativa e construção de comunidades.">
<meta property="og:title" content="Ju Ribeiro — Designer de Produto &amp; Comunicação">
<meta property="og:description" content="Entre pixels, pessoas e possibilidades. Experiências digitais, comunicação criativa e comunidades.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#7138D5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":"Ju Ribeiro","jobTitle":"Designer de Produto & Comunicação"}</script>
<style>
/* VOICE: brincalhão e editorial, mas profissional — um fanzine bem impresso.
   IDEA: um caderno de colagem: recortes, adesivos e etiquetas sobre faixas de cor chapada.
   PICTURE: colagem do hero com três recortes inclinados = as três dimensões do trabalho (e atalhos para elas).
   COLOUR+TYPE: roxo domina, lima/coral/azul alternam por seção; Archivo Black + DM Sans + Plex Mono só em etiquetas.
   LAYOUT: bandas de cor de ponta a ponta, grades assimétricas, cards horizontais para comunidades. */
:root{color-scheme:light dark;
--roxo:#7138D5;--lima:#C4F05A;--coral:#FF704E;--azul:#4779F5;--creme:#F5EEDC;--graf:#25212B;
--bg:light-dark(#F5EEDC,#1c1922);--ink:light-dark(#25212B,#F5EEDC);--card:light-dark(#FFFBF2,#2a2631);
--muted:light-dark(#554e5e,#c3bbcc);--edge:light-dark(#25212B,#F5EEDC);--focus:var(--roxo);
--h:'Archivo Black',Impact,'Arial Black',sans-serif;--t:'DM Sans',system-ui,-apple-system,sans-serif;--m:'IBM Plex Mono',ui-monospace,monospace}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-theme=dark]{--focus:var(--lima)}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--t);overflow-x:clip}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--h);font-weight:400;line-height:1.04;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:clamp(28px,3.4vw,42px)}
h3{font-size:clamp(20px,2vw,24px);line-height:1.15}
p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.b-roxo,.b-graf{--focus:var(--lima)}
.skip{position:absolute;left:12px;top:-60px;z-index:99;background:var(--lima);color:var(--graf);padding:10px 16px;border-radius:999px;font-weight:700}
.skip:focus{top:12px}
.wrap{max-width:1240px;margin:0 auto;position:relative}
.band{padding:clamp(56px,7vw,112px) max(5vw,16px);position:relative;overflow:clip}
.b-roxo{background:var(--roxo);color:#fff;--edge:#25212B;--muted:#ece4ff}
.b-lima{background:var(--lima);color:var(--graf);--edge:#25212B;--muted:#3b3644}
.b-coral{background:var(--coral);color:var(--graf);--edge:#25212B;--muted:#3a2a27}
.b-graf{background:var(--graf);color:var(--creme);--edge:#F5EEDC;--muted:#cdc5d6}
.b-azul{background:var(--azul);color:#fff;--edge:#25212B;--muted:#fff}
.lead{font-size:clamp(18px,1.6vw,21px);max-width:56ch;color:var(--muted)}
.note{font:500 13px/1.4 var(--m);color:var(--muted);margin-top:14px}
.shead .hint{font-size:14px;color:var(--muted);margin-top:8px}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:2px solid var(--edge)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:54px;padding:0 max(5vw,16px);max-width:1340px;margin:auto}
.logo{font-family:var(--h);font-size:21px;text-decoration:none;white-space:nowrap}
.hdr .logo{font:700 16px/1 var(--t);letter-spacing:.06em}
.logo sup{font-size:.5em;color:var(--roxo)}
.nav{display:flex;gap:2px;align-items:center}
.nav a{text-decoration:none;padding:7px 12px;border-radius:999px;font-weight:500;font-size:15px;white-space:nowrap}
.nav a:hover{background:color-mix(in srgb,var(--roxo) 15%,transparent)}
.nav a[aria-current=page]{background:var(--roxo);color:#fff}
.nav a.nav-cta{border:2px solid var(--edge);margin-left:6px}
.ns-t{position:relative}
.nav-soon{display:inline-flex;align-items:center;padding:7px 12px;font-weight:500;font-size:15px;white-space:nowrap;color:color-mix(in srgb,var(--ink) 38%,transparent);cursor:default}
.nav-soon .soon{position:absolute;bottom:-7px;right:-10px;border:0;background:var(--lima);color:var(--graf);font:700 7.5px/1 var(--m);padding:2px 5px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 1px 0 var(--graf)}
.soon{display:inline-block;font:500 11px/1 var(--m);padding:4px 7px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap;vertical-align:middle;letter-spacing:.02em}
.ftr-soon{position:relative;display:inline-flex;align-items:center;opacity:.75;cursor:default}
.ftr-soon,.area-soon .an,.lbl-soon{position:relative}
.ftr-soon .soon,.area-soon .soon,.lbl-soon .soon{position:absolute;border:0;background:var(--lima);color:var(--graf);font:700 9.5px/1 var(--m);padding:3px 6px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 1px 0 var(--graf)}
.ftr-soon .soon{top:-12px;right:-14px}
.area-soon{position:relative}.area-soon .soon{top:-10px;right:18px;font-size:11px;padding:4px 8px}
.lbl-soon{overflow:visible}.lbl-soon .soon{top:-10px;right:-10px}
.area-soon{cursor:default;color:color-mix(in srgb,var(--ink) 45%,transparent);border-color:color-mix(in srgb,var(--edge) 35%,transparent);justify-items:start}.area-soon p{color:inherit}.area-soon{transition:background .25s,color .25s}.area.area-soon:hover{background:color-mix(in srgb,var(--ink) 12%,transparent);color:color-mix(in srgb,var(--ink) 40%,transparent)}
.tile-soon{cursor:default}
.nav a.nav-in{width:38px;height:38px;padding:0;display:inline-grid;place-items:center;border-radius:50%;background:var(--ink);color:var(--bg);font:700 15px/1 var(--t);margin-left:6px;flex:none}
.nav a.nav-in:hover{background:var(--roxo);color:#fff}
.nav-in .in-tx{display:none}
.menu-btn{display:none;align-items:center;gap:8px;min-height:38px;padding:0 16px;border-radius:999px;border:2px solid var(--edge);background:var(--lima);color:var(--graf);font:700 15px var(--t);cursor:pointer}
.menu-btn i{display:block;width:16px;height:2px;background:currentColor;box-shadow:0 5px 0 currentColor,0 -5px 0 currentColor;transition:.2s}
.menu-btn[aria-expanded=true] i{box-shadow:none;transform:rotate(45deg)}
@media(max-width:1060px){
 .menu-btn{display:inline-flex}
 .nav{display:none;position:fixed;inset:54px 0 0 0;background:var(--roxo);flex-direction:column;align-items:stretch;padding:28px max(5vw,16px);gap:4px;overflow:auto}
 .nav.open{display:flex}
 .nav a{color:#fff;font-family:var(--h);font-size:clamp(28px,7vw,40px);font-weight:400;padding:10px 4px;border-radius:0;border-bottom:2px solid rgba(255,255,255,.18)}
 .nav a[aria-current=page]{background:none;color:var(--lima)}
 .nav a.nav-cta{border:0;border-bottom:2px solid rgba(255,255,255,.18);margin:0}
 .nav-soon{color:rgba(255,255,255,.55);font-family:var(--h);font-size:clamp(28px,7vw,40px);font-weight:400;padding:10px 4px;border-bottom:2px solid rgba(255,255,255,.18);gap:12px}
 .nav-soon .soon{top:auto;bottom:-2px;right:-66px;font:700 11px/1 var(--m);padding:4px 8px}
 .nav a.nav-in{width:auto;height:auto;display:block;background:none;border-radius:0;color:#fff;margin:0;font-family:var(--h);font-size:clamp(28px,7vw,40px);font-weight:400;padding:10px 4px}
 .nav-in .in-ic{display:none}.nav-in .in-tx{display:inline}
}

/* buttons, tags, stickers */
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:12px 22px;border-radius:999px;border:2px solid var(--edge);background:var(--creme);color:var(--graf);font:700 16px/1.1 var(--t);text-decoration:none;box-shadow:4px 4px 0 var(--edge);transition:transform .2s,box-shadow .2s;cursor:pointer}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--edge)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.btn svg{width:18px;height:18px;flex:none}
.btn-lima{background:var(--lima)}.btn-roxo{background:var(--roxo);color:#fff}.btn-coral{background:var(--coral)}
.btns{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 13px/1 var(--m);padding:7px 10px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.sticker{display:inline-block;background:var(--lima);color:var(--graf);font:700 15px/1 var(--t);padding:10px 16px;border-radius:999px;border:2px solid var(--graf);box-shadow:3px 3px 0 var(--graf);transform:rotate(-3deg)}
.ph{position:absolute;left:12px;bottom:12px;z-index:2;font:500 13px/1 var(--m);background:var(--graf);color:var(--lima);padding:6px 9px;border-radius:6px;pointer-events:none}

/* hero */
.hero{padding-bottom:clamp(48px,6vw,88px)}
.hero-g{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);grid-template-areas:"t c" "b c";grid-template-rows:auto 1fr;gap:20px 48px;align-items:start}
.hero-t{grid-area:t}.hero-c{grid-area:c}.hero-b{grid-area:b;display:grid;gap:26px}
.hero h1{font-size:clamp(42px,5.6vw,80px);line-height:.95;letter-spacing:-.03em;margin-top:22px;max-width:12ch}
.hero h1 span{display:block}
.tagline{font-family:var(--h);font-size:clamp(21px,2.1vw,27px);line-height:1.08;margin-top:26px;max-width:16ch}
.hero-b p{max-width:46ch;font-size:18.5px;color:var(--muted)}
.scribble{width:84px;height:46px;color:var(--lima)}
.collage{position:relative;aspect-ratio:1/1.04;width:100%;max-width:560px;margin-inline:auto}
.tile{position:absolute;width:60%;aspect-ratio:4/3;border:3px solid var(--graf);border-radius:18px;overflow:hidden;box-shadow:8px 8px 0 var(--graf);transition:transform .35s cubic-bezier(.2,.8,.2,1.2);display:block;background:var(--graf)}
.tile svg{position:absolute;inset:0;width:100%;height:100%}
.tile .lbl{position:absolute;top:12px;left:12px;z-index:2;background:var(--creme);color:var(--graf);font:700 14px/1 var(--t);padding:8px 12px;border-radius:999px;border:2px solid var(--graf)}
.t1{left:0;top:3%;transform:rotate(-6deg)}
.t2{right:0;top:33%;transform:rotate(5deg);z-index:2}
.t3{left:7%;bottom:0;transform:rotate(-2deg);z-index:1}
.tile:hover{transform:rotate(0) scale(1.04);z-index:5}
.tile-soon svg{transition:filter .3s}
.tile-soon:hover svg{filter:grayscale(1) brightness(1.05)}
.tile-soon:hover .lbl{color:#7a7480}
.badge{position:absolute;right:2%;top:-2%;z-index:4;width:clamp(120px,14vw,172px);aspect-ratio:1;border-radius:50%;background:var(--lima);border:3px solid var(--graf);box-shadow:5px 5px 0 var(--graf);transform:rotate(8deg);animation:wob 6s ease-in-out infinite}
.badge>img,.badge>svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.bph{position:absolute;left:50%;top:14%;transform:translateX(-50%);font:500 13px/1 var(--m);background:var(--graf);color:var(--lima);padding:4px 7px;border-radius:5px;white-space:nowrap}
.bcap{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%) rotate(-10deg);background:var(--creme);color:var(--graf);border:2px solid var(--graf);border-radius:999px;padding:6px 10px;font:700 13px/1 var(--t);white-space:nowrap}
@keyframes wob{50%{transform:rotate(-3deg) scale(1.03)}}
.blob{position:absolute;pointer-events:none}
@media(max-width:900px){.blob{display:none}}
@media(max-width:900px){.hero-g{grid-template-columns:1fr;grid-template-areas:"t" "c" "b";grid-template-rows:auto}.collage{max-width:460px}}

/* marquee */
.mq{background:var(--lima);color:var(--graf);border-block:2px solid var(--graf);overflow:hidden;padding:8px 0}
.mq-t{display:flex;width:max-content;animation:mq 45s linear infinite}
.mq-t span{font:500 clamp(15px,1.3vw,17px)/1.4 var(--t);white-space:nowrap;display:inline-flex;align-items:center;gap:20px;padding-right:20px}
.mq-t svg{width:14px;height:14px;flex:none}
@keyframes mq{to{transform:translateX(-50%)}}

/* section heads */
.shead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 40px;align-items:end;margin-bottom:clamp(28px,4vw,52px)}
.shead p{margin-top:14px}
.shead .sticker{justify-self:start;align-self:end}
.sfoot{margin-top:clamp(32px,4vw,52px);display:flex;justify-content:center}
@media(max-width:700px){.shead{grid-template-columns:1fr}}

/* project cards */
.pcard{background:var(--card);color:var(--ink);border:2px solid var(--edge);border-radius:20px;overflow:hidden;transition:transform .25s,box-shadow .25s}
.pcard:hover{transform:translateY(-6px) rotate(-.5deg);box-shadow:8px 8px 0 var(--edge)}
.pcard>a{display:flex;flex-direction:column;height:100%;text-decoration:none}
.pcover{position:relative;aspect-ratio:4/3;overflow:hidden;border-bottom:2px solid var(--edge);background:var(--graf);flex:none}
.pcover svg,.pcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.pcard:hover .pcover svg,.pcard:hover .pcover img{transform:scale(1.05)}
.pbody{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.pbody p{color:var(--muted);font-size:16px}
.more{font-weight:700;display:inline-flex;gap:8px;align-items:center;margin-top:auto;padding-top:6px}
.more svg{width:18px;height:18px;transition:transform .2s}
.pcard:hover .more svg{transform:translateX(5px)}
.b-coral .pcard,.b-lima .pcard{--card:#FFFBF2;--ink:#25212B;--muted:#554e5e}
.grid-home{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,28px)}
.grid-home .pcard:first-child{grid-column:span 2;grid-row:span 2}
.grid-home .pcard:first-child .pcover{aspect-ratio:auto;flex:1;min-height:300px}
.grid-home .pcard:first-child .pbody{flex:none}
.grid-home .pcard:first-child h3{font-size:clamp(26px,3vw,36px)}
.grid-d{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,28px)}
.grid-e{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(16px,2vw,28px);grid-auto-flow:dense}
.grid-e .pcard:nth-child(6n+1){grid-column:span 4}.grid-e .pcard:nth-child(6n+1) .pcover{aspect-ratio:16/10}
.grid-e .pcard:nth-child(6n+2){grid-column:span 2}.grid-e .pcard:nth-child(6n+2) .pcover{aspect-ratio:3/4}
.grid-e .pcard:nth-child(6n+3),.grid-e .pcard:nth-child(6n+4){grid-column:span 3}
.grid-e .pcard:nth-child(6n+5){grid-column:span 2}.grid-e .pcard:nth-child(6n+5) .pcover{aspect-ratio:1}
.grid-e .pcard:nth-child(6n){grid-column:span 4}.grid-e .pcard:nth-child(6n) .pcover{aspect-ratio:16/9}
.grid-e .pcard:nth-child(odd){transform:rotate(-.6deg)}.grid-e .pcard:nth-child(even){transform:rotate(.5deg)}
.grid-e .pcard:hover{transform:translateY(-6px) rotate(0)}
@media(max-width:900px){
 .grid-home,.grid-d{grid-template-columns:repeat(2,minmax(0,1fr))}
 .grid-home .pcard:first-child{grid-row:auto}
 .grid-e{grid-template-columns:repeat(2,minmax(0,1fr))}
 .grid-e .pcard:nth-child(n){grid-column:span 2}
 .grid-e .pcard:nth-child(6n+2),.grid-e .pcard:nth-child(6n+5){grid-column:span 1}
}
@media(max-width:600px){
 .grid-home,.grid-d,.grid-e{grid-template-columns:minmax(0,1fr)}
 .grid-home .pcard:first-child,.grid-e .pcard:nth-child(n){grid-column:auto}
 .grid-e .pcard .pcover{aspect-ratio:4/3!important}
}

/* works switcher (home) */
.works{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.65fr);gap:clamp(18px,2.4vw,32px);align-items:start}
.areas{display:grid;gap:12px;grid-auto-rows:1fr}
.area{text-align:left;border:2px solid var(--edge);border-radius:22px;padding:20px 22px;background:transparent;color:inherit;cursor:pointer;display:grid;gap:8px;font:inherit;transition:transform .25s,box-shadow .25s,background .25s}
.area:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.area .an{font-family:var(--h);font-size:clamp(20px,2vw,26px);line-height:1.05;display:flex;justify-content:space-between;align-items:center;gap:12px}
.area .an svg{width:22px;height:22px;flex:none;transition:transform .25s}
.area{align-content:start}
.area p{font-size:15px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.area .cnt{font:500 13px var(--m)}
.area[aria-selected=true]{background:var(--c);color:var(--fg);--muted:var(--fg);box-shadow:6px 6px 0 var(--edge);transform:translate(-3px,-3px)}
.area[aria-selected=true] .an svg{transform:translateX(4px)}
.panel{border:2px solid #25212B;border-radius:28px;padding:clamp(18px,2.4vw,30px);background:var(--c);color:var(--fg);box-shadow:8px 8px 0 #25212B;animation:pin .45s cubic-bezier(.2,.7,.2,1)}
@keyframes pin{from{opacity:0;transform:translateY(14px)}}
.panel-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}
.panel-h h3{font-size:clamp(22px,2.2vw,28px)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.panel .pcard{--card:#FFFBF2;--ink:#25212B;--muted:#554e5e;--edge:#25212B}
.panel .btn{--edge:#25212B}
@media(max-width:900px){.works{grid-template-columns:minmax(0,1fr)}.areas{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.area{padding:14px}.area p,.area .an svg{display:none}.area .an{font-size:clamp(15px,3.6vw,20px)}}
@media(max-width:600px){.pgrid{grid-template-columns:minmax(0,1fr)}.areas{grid-template-columns:minmax(0,1fr)}}

/* community cards */
.clist{display:grid;gap:clamp(22px,3vw,40px)}
.clist.c2{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.c2 .ccard{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);border-radius:22px}
.c2 .cphoto{min-height:300px}
.c2 .cinfo{padding:clamp(18px,2vw,26px);gap:12px}
.c2 .cinfo h3{font-size:clamp(20px,1.8vw,24px)}
.c2 .cinfo p{font-size:14.5px;line-height:1.55}
.c2 .btn{min-height:42px;padding:9px 16px;font-size:14px}
.c2 .btns{gap:6px 14px;flex-wrap:nowrap}
.c2 .btn{white-space:nowrap}
.btn.btn-link{background:none;border:0;box-shadow:none;padding:9px 2px;color:inherit;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.btn.btn-link:hover{transform:none;box-shadow:none;color:var(--roxo)}
@media(max-width:1060px){.clist.c2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){.c2 .ccard{grid-template-columns:minmax(0,1fr)}.c2 .cphoto{min-height:0;aspect-ratio:4/3}.c2 .btns{flex-wrap:wrap}}
.t-gdg{background:#fff;color:#25212B;border-color:#25212B;display:inline-flex;align-items:center;gap:3px}
.t-gdg i{width:7px;height:7px;border-radius:50%;display:inline-block}
.t-gdg i:nth-child(1){background:#4285F4}.t-gdg i:nth-child(2){background:#EA4335}.t-gdg i:nth-child(3){background:#FBBC04}.t-gdg i:nth-child(4){background:#34A853;margin-right:5px}
.cinfo .csub{font-weight:700;color:var(--graf);font-size:16px;line-height:1.35;margin-top:-4px}
.cinfo .cguest{font:500 13px/1.3 var(--m);color:var(--roxo);margin-top:-4px}
.ctopics .tag{font-size:13px;padding:6px 9px;text-transform:uppercase}
.rlist{border-top:1px solid rgba(245,238,220,.18)}

  if(b.cards)return `<div class="pcards">${b.cards.map(([t,x])=>`<div class="pc"><h3>${esc(t)}</h3><p>${md(x)}</p></div>`).join('')}</div>`;
  if(b.steps)return `<ol class="steps">${b.steps.map(([t,x],i)=>`<li><span class="sn" aria-hidden="true"></span><div><h3>${esc(t)}</h3><p>${md(x)}</p></div></li>`).join('')}</ol>`;
  if(b.kpis)return `<div class="kpis">${b.kpis.map(([k,t,x])=>`<div class="kpi"><strong>${esc(k)}</strong><h3>${esc(t)}</h3><p>${md(x)}</p></div>`).join('')}</div>`;
  if(b.ul)return `<ul class="dots">${b.ul.map(x=>`<li>${md(x)}</li>`).join('')}</ul>`;
  if(b.cards2)return `<div class="pcards pc2">${b.cards2.map(([t,x])=>`<div class="pc"><h3>${esc(t)}</h3><p>${md(x)}</p></div>`).join('')}</div>`;
  if(b.matrix)return `<div class="mx" role="table" aria-label="Taxa de convergência por domínio"><div class="mx-r mx-h" role="row"><span role="columnheader">Domínio</span><span role="columnheader">Convergência</span><span role="columnheader">Diagnóstico</span></div>${b.matrix.map(([d,r,l,x])=>`<div class="mx-r" role="row"><span role="cell" class="mx-d">${esc(d)}</span><span role="cell"><span class="mx-b mx-${l}">${esc(r)} · ${l==='alta'?'Alta':l==='media'?'Média':'Baixa'}</span></span><span role="cell" class="mx-x">${md(x)}</span></div>`).join('')}</div>`;
  if(b.list)return `<ul class="llist">${b.list.map(([t,x])=>`<li><h3>${esc(t)}</h3><p>${md(x)}</p></li>`).join('')}</ul>`;
  return '';
}
function Carousel(list,title){
  return `<div class="car${list.every(g=>g.video)?' car-video':''}" data-car aria-roledescription="carrossel" aria-label="Galeria de telas">
   <div class="car-vp"><div class="car-track">${list.map((g,i)=>`<figure class="car-s" aria-label="${i+1} de ${list.length}">
     ${g.video?`<div class="car-img" role="button" tabindex="0" data-zoom="${i}" data-video="${esc(g.video)}" data-poster="${esc(g.poster||'')}" data-alt="${esc(g.alt||title)}" data-cap="${esc(g.caption||'')}" aria-label="Ampliar vídeo: ${esc(g.caption||g.alt||title)}"><video src="${esc(g.video)}" poster="${esc(g.poster||'')}" muted loop playsinline autoplay preload="metadata" aria-hidden="true"></video></div>`
      :`<button type="button" class="car-img" data-zoom="${i}" data-src="${esc(g.src)}" data-alt="${esc(g.alt||title)}" data-cap="${esc(g.caption||'')}" aria-label="Ampliar: ${esc(g.caption||g.alt||title)}"><img src="${esc(g.src)}" alt="${esc(g.alt||title)}" loading="lazy"></button>`}
     ${g.caption?`<figcaption>${esc(g.caption)}</figcaption>`:''}</figure>`).join('')}</div></div>
   <div class="car-ctl">${list.length>1?`<button type="button" class="car-arrow car-prev" aria-label="Tela anterior">←</button>
    <div class="car-dots">${list.map((g,i)=>`<button type="button" class="car-dot" aria-label="Ir para a tela ${i+1}"></button>`).join('')}</div>
    <button type="button" class="car-arrow car-next" aria-label="Próxima tela">→</button>`:''}<span class="car-hint">Clique ${list[0].video&&list.length===1?'no vídeo':'na tela'} para ampliar</span></div>
  </div>`;
}
function CasePage(p){
  const C=CATS[p.cat],secs=CASE_SECTIONS[p.cat==='comunidade'?'comunidade':'base'],c=p.case||{};
  const heroBand={digital:'b-roxo',comunicacao:'b-coral',comunidade:'b-lima'}[p.cat];
  const fill=(v,hint)=>v==null||v===''?`<div class="todo"><b>para preencher</b>${esc(hint)}</div>`
    :Array.isArray(v)?`<ul>${v.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:String(v).split(/\n\n+/).map(x=>`<p>${esc(x)}</p>`).join('');
  const nGal=c.gallery?c.gallery.length:5;

  const sib=byCat(p.cat),next=sib[(sib.indexOf(p)+1)%sib.length];

    :[...secs.map(s=>[s[0],s[1]]),...(c.aprendizados?[['aprendizados','Aprendizados']]:[]),['galeria','Galeria'],['creditos','Créditos']];
  return `<section class="band ${heroBand} case-hero" aria-labelledby="h-case"><div class="wrap">
    <a class="crumb" href="#${C.route}">${ARROW}${esc(C.name)}</a>
    <h1 id="h-case">${esc(p.title)}</h1><p class="lead">${esc(p.summary)}</p>
    <dl class="meta"><div><dt>Categoria</dt><dd>${esc(C.name)}</dd></div>${p.date?`<div><dt>${p.cat==='comunidade'?'Data':'Ano'}</dt><dd>${esc(p.date)}</dd></div>`:''}<div><dt>Meu papel</dt><dd>${esc(p.role||'—')}</dd></div></dl>
    ${Tags(p.tags)}</div></section>
   <div class="cover-wrap"><div class="case-cover">${cover(p,p.cat==='comunidade'?'foto provisória':'imagem provisória')}</div></div>
   ${c.stats?`<div class="stats-wrap"><div class="stats reveal">${c.stats.map(([n,l])=>`<div><strong>${esc(n)}</strong><span>${esc(l)}</span></div>`).join('')}</div></div>`:''}
   <section class="band"><div class="wrap case-body">
    <nav class="toc" aria-label="Seções do case">${toc.map(([id,l])=>`<a href="#case-${p.slug}" data-scroll="cs-${id}">${esc(l)}</a>`).join('')}</nav>
    <div>
     ${custom?c.sections.map(x=>`<section class="csec reveal" id="cs-${x.id}"><h2>${esc(x.title)}</h2>${x.blocks.map(Block).join('')}</section>`).join('')
       :secs.map(([id,l,hint])=>`<section class="csec reveal" id="cs-${id}"><h2>${esc(l)}</h2>${fill(c[id],hint)}</section>`).join('')}
     ${c.aprendizados?`<section class="csec reveal" id="cs-aprendizados"><h2>Meus aprendizados</h2>${fill(c.aprendizados,'')}${c.citacao?`<blockquote class="cquote">${esc(c.citacao)}</blockquote>`:''}</section>`:''}
     ${p.link?`<div class="csec reveal"><a class="btn btn-lima" href="${esc(p.link)}" target="_blank" rel="noopener">Ver case original${ARROW}</a></div>`:''}
     <section class="csec" id="cs-galeria"><h2>Galeria</h2>${c.gallery?(c.gallerySmall?`<div class="car-sm">${Carousel(c.gallery,p.title)}</div>`:Carousel(c.gallery,p.title)):`<div class="gal">${gal}</div>`}</section>
     ${custom&&!c.creditos?'':`<section class="csec reveal" id="cs-creditos"><h2>Créditos e colaboradores</h2>${fill(c.creditos,'Liste quem fez parte, quando aplicável (aceita lista). Se não houver, remova esta seção.')}</section>`}
    </div></div></section>
   ${next&&next!==p?`<a class="band b-graf next" href="${caseHref(next)}"><div class="wrap"><small>Próximo projeto · ${esc(C.name)}</small><h2>${esc(next.title)}${ARROW}</h2></div></a>`:''}`;
}

     ['Destaques de Carreira',['+'+CONFIG.years+' anos de experiência em design','Pós-graduação em User Experience Design pela PUCRS','Organizadora do Google Developers Group BH','Community Manager da Comunidade UXis','Estruturação de cultura de métricas em UX','Mentora de UX em voluntariado','Experiência em projetos digitais, gráficos e estampas para produtos','Atuação na organização de eventos e comunidades de tecnologia','Trajetória profissional multidisciplinar, com formação também na área da saúde']]
    ].map(([t,items])=>`<div class="dim reveal"><h3>${esc(t)}</h3><ul>${items.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`).join('')}</div>
    <div class="dim tcard reveal"><h3>Ferramentas</h3><div class="tools">${['Figma','FigJam','Jira','Confluence','Notion','Miro','Maze','Dovetail','Trello','Claude','Google Analytics','Pacote Adobe','Slack','Framer','Wix Studio'].map(t=>Tag(t)).join('')}</div></div>
   </div></section>
   <section class="band b-graf" aria-label="Trajetória"><div class="wrap">
    <div class="reveal traj"><h2>Trajetória</h2><div class="tl">
     ${TRAJETORIA.map(x=>x?`<div class="tl-i"><span class="tl-p">${esc(x.periodo)}</span><h3>${esc(x.cargo)}${x.empresa?' · '+esc(x.empresa):''}</h3><p class="tl-d">${esc(x.descricao)}</p>${(x.tags||[]).length?`<div class="tags tl-t">${x.tags.map(t=>Tag(t)).join('')}</div>`:''}</div>`:`<div class="tl-i"><span class="tl-p">Período</span><h3>Cargo · Empresa</h3><div class="todo"><b>para preencher</b>Empresa ou projeto, o que você fazia e o que levou dali.</div></div>`).join('')}
    </div></div></div></section>
   ${Contact()}`;

function NotFound(){
  return `<section class="band b-coral chero"><div class="wrap"><h1>Ops, essa página não existe.</h1><p class="lead">Talvez o projeto tenha mudado de endereço.</p><div class="btns" style="margin-top:28px">${Button('Voltar ao início','#inicio','btn-lima')}</div></div></section>`;
}

/* ---------- roteador (rotas amigáveis via #nome) ---------- */
const META={inicio:'Portfólio de Ju Ribeiro, Designer de Produto & Comunicação há +6 anos.',sobre:'Trajetória, áreas de atuação e ferramentas de Ju Ribeiro.'};
let first=true,io=null;
function setMeta(title,desc){document.title=title;const m=document.querySelector('meta[name=description]');if(m&&desc)m.setAttribute('content',desc)}
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  let html,active='',scrollTo=null;
  const catKey=Object.keys(CATS).find(k=>CATS[k].route===h&&!isSoon(k));
  if(!h||h==='inicio'||h==='contato'){html=Home();active=h==='contato'?'contato':'inicio';if(h==='contato')scrollTo='sec-contato';setMeta('Ju Ribeiro — Designer de Produto & Comunicação',META.inicio)}
  else if(catKey){html=CategoryPage(catKey);active=h;setMeta(CATS[catKey].name+' — Ju Ribeiro',CATS[catKey].lead)}
  else if(h==='sobre'){html=AboutPage();active='sobre';setMeta('Sobre mim — Ju Ribeiro',META.sobre)}
  else if(h.startsWith('case-')){const p=PROJECTS.find(x=>'case-'+x.slug===h&&!isSoon(x.cat));
    if(p){html=CasePage(p);active=CATS[p.cat].route;setMeta(p.title+' — Ju Ribeiro',p.summary)}else html=NotFound()}
  else{const el=document.getElementById(h);if(el&&main.contains(el)){el.scrollIntoView();return}html=NotFound()}
  main.innerHTML=html;
  document.getElementById('hdr').innerHTML=Header(active);
  document.body.style.overflow='';
  if(scrollTo){requestAnimationFrame(()=>document.getElementById(scrollTo)?.scrollIntoView())}else if(!first)window.scrollTo(0,0);
  if(!first)main.focus({preventScroll:true});
  first=false;
  observe();
  applyFilter();
  initCarousels();
  spyToc();
  if(LB.open)LB.close();
}
function observe(){
  const els=main.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px',threshold:.05});
  els.forEach(e=>io.observe(e));
}

/* ---------- carrossel + lightbox ---------- */
let carTimer=null;
function spyToc(){
  const toc=document.querySelector('.toc');if(!toc)return;
  const links=[...toc.querySelectorAll('a[data-scroll]')];let cur=links[0];
  const atEnd=innerHeight+scrollY>=document.documentElement.scrollHeight-4;
  for(const a of links){const el=document.getElementById(a.dataset.scroll);if(el&&el.getBoundingClientRect().top<=innerHeight*0.35)cur=a}
  if(atEnd)cur=links[links.length-1];
  links.forEach(a=>a===cur?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current'));
}
addEventListener('scroll',()=>requestAnimationFrame(spyToc),{passive:true});
addEventListener('resize',spyToc);
function initCarousels(){
  clearInterval(carTimer);carTimer=null;
  const car=main.querySelector('[data-car]');if(!car)return;
  const track=car.querySelector('.car-track'),n=track.children.length;let i=0,paused=false;
  const go=k=>{i=(k+n)%n;track.style.transform=`translateX(${-i*100}%)`;car.querySelectorAll('.car-dot').forEach((d,j)=>d.setAttribute('aria-current',j===i));
    [...track.children].forEach((s,j)=>{s.setAttribute('aria-hidden',j!==i);s.querySelector('[data-zoom]').tabIndex=j===i?0:-1})};
  car.addEventListener('mouseenter',()=>paused=true);car.addEventListener('mouseleave',()=>paused=false);
  car.addEventListener('focusin',()=>paused=true);car.addEventListener('focusout',()=>paused=false);
  const pv=car.querySelector('.car-prev'),nx=car.querySelector('.car-next');
  if(pv)pv.addEventListener('click',()=>go(i-1));if(nx)nx.addEventListener('click',()=>go(i+1));
  car.querySelectorAll('.car-dot').forEach((d,j)=>d.addEventListener('click',()=>go(j)));
  go(0);
  if(n>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches)carTimer=setInterval(()=>{if(!paused&&!document.hidden&&!LB.open)go(i+1)},3500);
}
const LB=document.createElement('dialog');LB.className='lb';LB.setAttribute('aria-label','Imagem ampliada');
LB.innerHTML='<button type="button" class="lb-x" aria-label="Fechar">×</button><button type="button" class="lb-p" aria-label="Anterior">‹</button><figure><img alt=""><video controls muted loop playsinline hidden></video><figcaption></figcaption></figure><button type="button" class="lb-n" aria-label="Próxima">›</button>';
document.body.appendChild(LB);
let lbList=[],lbI=0;
function lbShow(k){if(!lbList.length)return;lbI=(k+lbList.length)%lbList.length;const g=lbList[lbI],im=LB.querySelector('img'),vd=LB.querySelector('video');
  if(g.video){im.hidden=true;im.removeAttribute('src');vd.hidden=false;vd.poster=g.poster||'';vd.src=g.video;vd.setAttribute('aria-label',g.alt);try{vd.play().catch(()=>{})}catch(err){}}
  else{vd.pause();vd.hidden=true;vd.removeAttribute('src');im.hidden=false;im.src=g.src;im.alt=g.alt}
  LB.querySelector('figcaption').textContent=g.cap;
  LB.querySelector('.lb-p').hidden=LB.querySelector('.lb-n').hidden=lbList.length<2}
function lbOpenAt(list,k){lbList=list;lbShow(k);try{LB.showModal()}catch(err){LB.setAttribute('open','')}}
LB.addEventListener('click',e=>{if(e.target===LB||e.target.closest('.lb-x')){LB.close();return}if(e.target.closest('.lb-p'))lbShow(lbI-1);if(e.target.closest('.lb-n'))lbShow(lbI+1)});
LB.addEventListener('close',()=>{const v=LB.querySelector('video');v.pause()});
main.addEventListener('keydown',e=>{const z=e.target.closest&&e.target.closest('div[data-zoom]');if(z&&(e.key==='Enter'||e.key===' ')){e.preventDefault();z.click()}});
LB.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')lbShow(lbI-1);if(e.key==='ArrowRight')lbShow(lbI+1)});

/* ---------- interações ---------- */
document.addEventListener('click',e=>{
  const mb=e.target.closest('.menu-btn');
  if(mb){const open=mb.getAttribute('aria-expanded')!=='true';mb.setAttribute('aria-expanded',open);document.getElementById('nav').classList.toggle('open',open);document.body.style.overflow=open?'hidden':'';return}
  if(e.target.closest('.nav a')){document.body.style.overflow=''}
  const sc=e.target.closest('[data-scroll]');
  if(sc){const t=document.getElementById(sc.dataset.scroll);if(t){e.preventDefault();t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}return}
  const cp=e.target.closest('[data-copy]');
  if(cp){const v=cp.dataset.copy;const done=ok=>{cp.textContent=ok?'Copiado!':'Selecione e copie';setTimeout(()=>cp.textContent='Copiar e-mail',2000)};
    try{navigator.clipboard.writeText(v).then(()=>done(true),()=>done(false))}catch(err){done(false)}return}
  const ar=e.target.closest('[data-area]');
  if(ar){selectArea(ar.dataset.area);return}
  const z=e.target.closest('[data-zoom]');
  if(z){const list=[...main.querySelectorAll('[data-zoom]')].map(el=>({src:el.dataset.src||'',video:el.dataset.video||'',poster:el.dataset.poster||'',alt:el.dataset.alt||'',cap:el.dataset.cap||''}));lbOpenAt(list,+z.dataset.zoom);return}
  const ft=e.target.closest('.ft');
  if(ft){ft.parentElement.querySelectorAll('.ft').forEach(b=>b.setAttribute('aria-pressed',b===ft));applyFilter();return}
  const pd=e.target.closest('[data-pending]');
  if(pd){e.preventDefault();pd.firstChild.textContent='Link em breve ';return}
  const cv=e.target.closest('[data-cv-missing]');
  if(cv){e.preventDefault();cv.firstChild.textContent='Currículo em breve ';}
});
main.addEventListener('mouseover',e=>{const ar=e.target.closest('[data-area]');if(ar&&matchMedia('(hover: hover)').matches)selectArea(ar.dataset.area)});
main.addEventListener('focusin',e=>{const ar=e.target.closest('[data-area]');if(ar)selectArea(ar.dataset.area)});
main.addEventListener('keydown',e=>{const ar=e.target.closest('[data-area]');if(!ar||!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();
  const ks=Object.keys(CATS).filter(k=>!isSoon(k)),i=ks.indexOf(ar.dataset.area),d=e.key==='ArrowDown'||e.key==='ArrowRight'?1:-1;selectArea(ks[(i+d+ks.length)%ks.length],true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const mb=document.querySelector('.menu-btn[aria-expanded=true]');if(mb)mb.click()}});
document.getElementById('skip').addEventListener('click',e=>{e.preventDefault();main.focus()});

document.documentElement.classList.add('js');
document.getElementById('ftr').innerHTML=Footer();
addEventListener('hashchange',route);
route();
}
